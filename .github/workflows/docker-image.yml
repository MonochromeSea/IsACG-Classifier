name: Docker Hub

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/isacg-classifier

jobs:
  docker:
    name: Build and push images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata for CPU image
        id: meta_cpu
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cpu
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=cpu-
            type=ref,event=tag

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=python:3.12-slim-bookworm
            REQUIREMENTS_FILE=requirements.txt
          tags: ${{ steps.meta_cpu.outputs.tags }}
          labels: ${{ steps.meta_cpu.outputs.labels }}
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu

      - name: Docker metadata for Vulkan image
        id: meta_vulkan
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=vulkan
            type=sha,prefix=vulkan-
            type=ref,event=tag,suffix=-vulkan

      - name: Build and push Vulkan image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.vulkan
          push: true
          build-args: |
            PYTHON_SLIM_IMAGE=python:3.12-slim-bookworm
          tags: ${{ steps.meta_vulkan.outputs.tags }}
          labels: ${{ steps.meta_vulkan.outputs.labels }}
          cache-from: type=gha,scope=vulkan
          cache-to: type=gha,mode=max,scope=vulkan
