services:
  isacg:
    build:
      context: .
      dockerfile: Dockerfile.vulkan
      args:
        PYTHON_SLIM_IMAGE: "${PYTHON_SLIM_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim-bookworm}"
    environment:
      ISACG_DEVICE: VULKAN
      XDG_RUNTIME_DIR: /tmp/runtime-root
    devices:
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      - "c 226:* rmw"
    group_add:
      - "${ISACG_RENDER_GID:-0}"
    volumes:
      - ${ISACG_SOURCE_DIR:-./data/source}:/data/source
      - ${ISACG_ACG_DIR:-./data/acg}:/data/acg
      - ${ISACG_NON_ACG_DIR:-./data/non_acg}:/data/non_acg
