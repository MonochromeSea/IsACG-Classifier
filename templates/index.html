<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IsACG 图片风格分类器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">IsACG Image Classifier</p>
          <h1>图片风格分类器</h1>
          <p class="intro">判断图片是否属于 ACG、二次元、漫画或游戏风格。</p>
        </div>
        <div class="topbar-actions">
          <nav class="top-nav" aria-label="页面导航">
            <span class="active-page">单张识别</span>
            <a href="/settings">文件夹设置</a>
          </nav>
          <button id="themeToggle" class="theme-toggle" type="button">深色</button>
          <div class="status-pill" id="statusPill">
            <span class="status-dot"></span>
            <span id="statusText">模型已就绪</span>
          </div>
        </div>
      </header>

      <section class="workspace">
        <div class="upload-panel">
          <div class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="选择或拖入图片">
            <input id="fileInput" type="file" accept="image/*" multiple hidden />
            <div class="drop-icon" aria-hidden="true">＋</div>
            <div class="drop-title">拖入图片，或点击选择</div>
            <div class="drop-hint">支持 JPG、PNG、WebP、BMP，一次最多 40 张</div>
          </div>

          <div class="control-row">
            <label class="field">
              <span>分类模型</span>
              <div class="select-wrap">
                <select id="modelSelect" class="select-control">
                  {% for model_id, model in models.items() %}
                    <option value="{{ model_id }}" {% if model_id == default_model %}selected{% endif %}>
                      {{ model.title }} · {{ model.description }}
                    </option>
                  {% endfor %}
                </select>
              </div>
            </label>
            <button id="classifyButton" class="primary-button" type="button">开始分类</button>
            <button id="clearButton" class="ghost-button" type="button">清空</button>
          </div>
        </div>

        <div class="queue-block" id="queueBlock" hidden>
          <div class="section-heading">
            <h2>待分类图片</h2>
            <span id="queueCount" class="count-badge">0 张</span>
          </div>
          <div class="queue-grid" id="queueGrid"></div>
        </div>

        <div class="result-block">
          <div class="section-heading">
            <h2>分类结果</h2>
            <div class="section-actions">
              <span id="resultCount" class="count-badge">暂无</span>
              <button id="moveAllButton" class="secondary-button" type="button" disabled>按结果移动全部</button>
            </div>
          </div>
          <div class="empty-state" id="emptyState">
            <div class="empty-mark" aria-hidden="true">◇</div>
            <p>选择图片后，点击“开始分类”查看结果。</p>
          </div>
          <div class="result-grid" id="resultGrid"></div>
        </div>
      </section>
    </main>

    <template id="queueItemTemplate">
      <div class="queue-item">
        <img alt="" />
        <div class="queue-meta">
          <span class="queue-name"></span>
          <button class="remove-button" type="button" aria-label="移除">×</button>
        </div>
      </div>
    </template>

    <template id="resultCardTemplate">
      <article class="result-card">
        <div class="result-image">
          <img alt="" />
        </div>
        <div class="result-body">
          <div class="result-topline">
            <span class="result-label"></span>
            <span class="result-confidence"></span>
          </div>
          <div class="meter" aria-hidden="true">
            <span class="meter-fill"></span>
          </div>
          <div class="result-meta">
            <span class="result-model"></span>
            <span class="result-time"></span>
          </div>
          <p class="result-filename"></p>
          <div class="result-actions">
            <button class="move-acg-button action-button" type="button">存入 ACG</button>
            <button class="move-nonacg-button action-button" type="button">存入非 ACG</button>
          </div>
          <p class="move-state"></p>
        </div>
      </article>
    </template>

    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
